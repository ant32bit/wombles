<!doctype html>
<html>
<head>
    <title>ant32bit.dev</title>
    <link rel="shortcut icon" type="image/png" href="{{favicon.png}}"/>
    <link rel="stylesheet" type="text/css" href="{{main.css}}"></link>
    <script src="https://kit.fontawesome.com/f0e979dbc7.js" crossorigin="anonymous"></script>
    <script src="{{console.js}}"></script>
</head>
<body>
    <form id="start-params">
        <label for="initial-womble">Initial Womble</label>
        <textarea id="code" name="initial-womble"></textarea>
        <div id="vm-settings">
            <div id="vm-params">
                <div class="param-group">
                    <h4>Memory</h4>
                    <div class="param">
                        <label for="memory-size">Memory Capacity</label>
                        <select name="memory-size">
                            <option value="20" selected>1 MB</option>
                            <option value="21">2 MB</option>
                            <option value="22">4 MB</option>
                            <option value="23">8 MB</option>
                            <option value="24">16 MB</option>
                            <option value="25">32 MB</option>
                            <option value="26">64 MB</option>
                        </select>
                    </div>
                    <div class="param">
                        <label for="process-size">Process Size</label>
                        <select name="process-size">
                            <option value="8" selected>256 B</option>
                            <option value="9">512 B</option>
                            <option value="10">1 kB</option>
                            <option value="11">2 kB</option>
                            <option value="12">4 kB</option>
                            <option value="13">8 kB</option>
                            <option value="14">16 kB</option>
                            <option value="15">32 kB</option>
                            <option value="16">64 kB</option>
                            <option value="17">128 kB</option>
                            <option value="18">256 kB</option>
                        </select>
                    </div>
                </div>
                <div class="param-group">
                    <h4>Processor Volatility</h4>
                    <div class="param">
                        <label for="process-lifetime">Maximum Process Lifetime</label>
                        <input type="number" name="process-lifetime" min="1" step="1" value="2000"> ticks
                    </div>
                    <div class="param">
                        <label for="cpm-mutation-rate">Bit mutation rate of cpm</label>
                        <input type="number" name="cpm-mutation-rate" min="0" max="100" step=".1" value="0.5"> %
                    </div>
                    <div class="param">
                        <label for="imp-miss-rate">Miss rate for imp</label>
                        <input type="number" name="imp-miss-rate" min="0" max="100" step=".1" value="0.5"> %
                    </div>
                </div>
            </div>
            <div id="vm-start">
                <input type="submit" id="submit" value="Start" disabled>
            </div>
        </div>
    </form>
    <div id="snapshot-display" class="hidden">
        <div class="memory-frame">
            <canvas id="memory-representation"></canvas>
        </div>
        <div id="control-panel">
            <div class="actions">
                <button id="start"><i class="fa-solid fa-play"></i></button>
                <button id="step"><i class="fa-solid fa-forward-step"></i></button>
                <button id="pause" disabled><i class="fa-solid fa-pause"></i></button>
            </div>
            <div class="spacer"></div>
            <div class="counter">
                <i class="fa-solid fa-stopwatch"></i> <span id="tick-counter"> 0</span>
            </div>
            <div class="counter">
                <i class="fa-solid fa-window-restore"></i> <span id="program-counter"> 0</span>
            </div>
        </div>
    </div>
    <div id="processes-display" class="hidden">
        <ul id="processes-list"></ul>
        <ul id="process-registers"></ul>
        <ul id="process-code"></ul>
    </div>
</body>
</html>
